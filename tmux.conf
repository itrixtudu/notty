unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix
bind-key C-S-Down split-window -v
bind-key C-S-Right split-window -h



# ════════════════════════════════════════════════════════════
# Claude's Cozy tmux Config 🐭
# Mouse support + quality of life improvements
# ════════════════════════════════════════════════════════════

# ┌─────────────────────────────────────────────────────────┐
# │ MOUSE SUPPORT - The main event! 🎯                      │
# └─────────────────────────────────────────────────────────┘
set -g mouse on

# ┌─────────────────────────────────────────────────────────┐
# │ SCROLLBACK BUFFER - More history!                       │
# └─────────────────────────────────────────────────────────┘
set -g history-limit 10000

# ┌─────────────────────────────────────────────────────────┐
# │ QUALITY OF LIFE IMPROVEMENTS                            │
# └─────────────────────────────────────────────────────────┘

# Start windows and panes at 1, not 0 (easier to reach on keyboard)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Much faster key repetition
set -s escape-time 0

# Increase repeat timeout
set -g repeat-time 600

# Focus events for vim/neovim
set -g focus-events on

# Better colors (256 color support)
set -g default-terminal "screen-256color"
#set -g default-terminal "tmux-256color"
#set -as terminal-overrides ",*:Tc"
# Force tmux to assume the terminal supports UTF-8
#set -ga terminal-overrides ",screen-256color:Tc"
#set -as terminal-overrides ',*:U8=0'

