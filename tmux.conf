# ┌─────────────────────────────────────────────────────────┐
# │ ADDITIONAL MOUSE BEHAVIORS                              │
# └─────────────────────────────────────────────────────────┘

# Copy mode mouse selection improvements
# When you select text with mouse, it auto-copies
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"

# Middle click to paste
bind-key -n MouseDown2Pane run "tmux set-buffer \"$(xclip -o -sel clipboard)\"; tmux paste-buffer"

# ┌─────────────────────────────────────────────────────────┐
# │ VI MODE (if you're into that)                           │
# └─────────────────────────────────────────────────────────┘
setw -g mode-keys vi

# ┌─────────────────────────────────────────────────────────┐
# │ BETTER PREFIX KEY? (Optional)                           │
# └─────────────────────────────────────────────────────────┘
# Uncomment if you want Ctrl+A instead of Ctrl+B
# It's easier to reach! Many people prefer it.
# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix

# ┌─────────────────────────────────────────────────────────┐
# │ EASIER PANE SPLITTING                                   │
# └─────────────────────────────────────────────────────────┘
# Split panes using | and - (more intuitive)
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# ┌─────────────────────────────────────────────────────────┐
# │ PANE NAVIGATION (Vim-style)                            │
# └─────────────────────────────────────────────────────────┘
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ┌─────────────────────────────────────────────────────────┐
# │ RELOAD CONFIG                                           │
# └─────────────────────────────────────────────────────────┘
# Prefix + r to reload this config
bind r source-file ~/.tmux.conf \; display "✨ Config reloaded!"

# ┌─────────────────────────────────────────────────────────┐
# │ STATUS BAR PRETTIFICATION                               │
# └─────────────────────────────────────────────────────────┘
set -g status-interval 5  # Refresh every 5 seconds
set -g status-style 'bg=#1a1a2e fg=#00ff00'
set -g status-left '[#S] #(echo $HOST) '
#set -g status-right "#[fg=cyan]Host:#(echo $HOSTNAME)|#(echo $HOST) Docker: #(echo $DOCKER_HOST)#[default] | 🤖 %H:%M %d-%b-%y"
#set -g status-right-length 20
set -g status-right "#[fg=cyan] #(echo $HOST)#(echo $HOSTNAME)᚛#(echo $DOCKER_HOST)#[default] | 🤖 %H:%M %d-%b-%y"
#set -g status-left-length 20
